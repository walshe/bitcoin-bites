name: Deploy web site

# Builds the static site from content/facts and publishes it to GitHub Pages.
# Requires Settings → Pages → Source = "GitHub Actions" (one-time setup).
# Built files are uploaded as a Pages artifact - nothing is committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than racing an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Test client-side JavaScript
        run: node --test "web/src/test/js/*.test.js"

      - name: Test and build site
        run: >
          ./gradlew :content-compiler:test :web:test :web:buildSite
          -PsiteBaseUrl=${{ steps.pages.outputs.base_url }}/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
